<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Warframe State Graph — Note</title>
<script>
  // フラッシュ防止: CSS描画より前に手動テーマ選択をhtml要素へ同期反映する（theme.js本体はページ末尾で読み込む）。
  (function () {
    try {
      var t = localStorage.getItem("warframe-state-graph:theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --panel-blur: 5px;
    --bg: #12141a;
    --panel: rgba(27, 30, 39, 0.35);
    --popover-bg: rgba(20, 22, 28, 0.94);
    --border: #454b5c;
    --text: #e4e6ec;
    --muted: #9aa0ab;
    --accent: #f6ddaa;
    --danger: #e88c93;
    --actionable: #7ee3a9;
    --satisfied: #9bbeec;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8;
      --panel: rgba(255, 255, 255, 0.4);
      --popover-bg: rgba(255, 255, 255, 0.96);
      --border: #aab0bd;
      --text: #1c1e24;
      --muted: #3c3f48;
      --accent: #a7750a;
      --danger: #992e37;
      --actionable: #1a834d;
      --satisfied: #2b65b1;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --panel: rgba(255, 255, 255, 0.4);
    --popover-bg: rgba(255, 255, 255, 0.96);
    --border: #aab0bd;
    --text: #1c1e24;
    --muted: #3c3f48;
    --accent: #a7750a;
    --danger: #992e37;
    --actionable: #1a834d;
    --satisfied: #2b65b1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
    padding: 14px;
  }
  h1 { font-size: 1.8rem; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
  .app-icon { width: 64px; height: 64px; flex-shrink: 0; }
  @media (max-width: 480px) {
    body { padding-top: 54px; }
    .app-icon { width: 36px; height: 36px; }
    h1 { font-size: 1.05rem; gap: 8px; }
    h1 .subtitle { display: none; }
  }
  nav { font-size: 0.85rem; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 12px; }
  nav a.current { color: var(--accent); }
  nav a:hover { color: var(--accent); }

  #toast-container {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 500;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .toast {
    background: var(--popover-bg); backdrop-filter: blur(var(--panel-blur)); -webkit-backdrop-filter: blur(var(--panel-blur));
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px 10px 14px; font-size: 0.85rem; max-width: 320px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    display: flex; align-items: flex-start; gap: 8px;
    opacity: 0; transform: translateY(8px); transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast-text { flex: 1; }
  .toast-close { flex-shrink: 0; background: transparent; border: none; padding: 2px; color: inherit; cursor: pointer; opacity: 0.7; line-height: 0; }
  .toast-close:hover { opacity: 1; }
  .toast-error { border-color: var(--danger); color: var(--danger); }
  .toast-success { border-color: var(--satisfied); color: var(--satisfied); }

  .panel {
    background: var(--panel);
    backdrop-filter: blur(var(--panel-blur));
    -webkit-backdrop-filter: blur(var(--panel-blur));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
  }
  .panel-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  /* note-live-editor自体のベースCSSはscratch.tsがページ共通で注入済み
     （クイックメモウィジェット用、`.note-live-editor`クラスは意図的に
     全ページ共通スコープ、scratch.tsのコメント参照）。ここでは「大きい
     メモ」用に高さだけこのページ専用に上書きする。 */
  #note-editor.note-live-editor {
    min-height: 70vh;
    max-height: none;
    font-size: 0.95rem;
    line-height: 1.6;
    padding: 16px;
  }
</style>
</head>
<body>
  <h1><img src="/favicon.svg" alt="" class="app-icon">Warframe State Graph <span class="subtitle" style="opacity:.55;font-weight:400;font-size:.75em">— Note</span></h1>
  <nav>
    <a href="/">Chain View</a>
    <a href="/loadouts.html">Loadouts</a>
    <a href="/collections.html">Collections</a>
    <a href="/standing.html">Standing</a>
    <a href="/stats.html">Stats</a>
    <a href="/note.html" class="current">Note</a>
    <span style="flex:1"></span>
  </nav>

  <div class="panel">
    <div class="panel-title">Note</div>
    <div id="note-editor"></div>
  </div>

<script type="module" src="/note.js"></script>
<script src="/notemd.js"></script>
<script src="/wallpaper.js"></script>
<script src="/theme.js"></script>
<script src="/scroll-top.js"></script>
<script src="/debug-grid.js"></script>
</body>
</html>
