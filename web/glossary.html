<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Warframe State Graph — Glossary (debug)</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem("warframe-state-graph:theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #12141a;
    --panel: rgba(27, 30, 39, 0.35);
    --border: #2a2e3a;
    --text: #e4e6ec;
    --muted: #7c818f;
    --accent: #f6ddaa;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8;
      --panel: rgba(255, 255, 255, 0.4);
      --border: #d8dbe2;
      --text: #1c1e24;
      --muted: #3c3f48;
      --accent: #a7750a;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --panel: rgba(255, 255, 255, 0.4);
    --border: #d8dbe2;
    --text: #1c1e24;
    --muted: #3c3f48;
    --accent: #a7750a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
    padding: 14px;
  }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 4px; }
  .hint { font-size: 0.78rem; color: var(--muted); margin-bottom: 14px; }
  nav { font-size: 0.85rem; margin-bottom: 14px; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 12px; }
  nav a:hover { color: var(--accent); }
  .category-label { font-size: 0.85rem; font-weight: 600; margin: 16px 0 6px; color: var(--accent); }
  table { border-collapse: collapse; width: 100%; max-width: 640px; font-size: 0.85rem; }
  th, td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
  .empty { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Glossary（用語対応表、デバッグ用）</h1>
<div class="hint">現在アプリ内に登録されている英→日対応の一覧（<code>/api/glossary</code>、読み取り専用）。編集はヘッダーの設定モーダル「用語」タブから。</div>
<nav><a href="/">Chain View</a><a href="/loadouts.html">Loadouts</a><a href="/collections.html">Collections</a><a href="/standing.html">Standing</a><a href="/stats.html">Stats</a></nav>
<div id="content"></div>
<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function load() {
  const el = document.getElementById("content");
  const res = await fetch("/api/glossary");
  if (!res.ok) { el.innerHTML = `<div class="empty">取得に失敗しました</div>`; return; }
  const data = await res.json();
  const entries = Object.values(data.entries || {});
  if (!entries.length) { el.innerHTML = `<div class="empty">登録なし</div>`; return; }

  const byCategory = {};
  entries.forEach((e) => {
    const cat = e.category || "（カテゴリなし）";
    (byCategory[cat] = byCategory[cat] || []).push(e);
  });

  el.innerHTML = Object.keys(byCategory).sort().map((cat) => {
    const rows = byCategory[cat].sort((a, b) => a.enKey.localeCompare(b.enKey)).map((e) =>
      `<tr><td>${escapeHtml(e.enKey)}</td><td>${escapeHtml(e.ja)}</td></tr>`
    ).join("");
    return `<div class="category-label">${escapeHtml(cat)}（${byCategory[cat].length}件）</div>` +
      `<table><thead><tr><th>English</th><th>日本語</th></tr></thead><tbody>${rows}</tbody></table>`;
  }).join("");
}
load();
</script>
</body>
</html>
