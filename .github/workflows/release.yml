name: Release

# Tag push (e.g. `v1.0.0`) triggers a build of the distributable Windows exe
# and attaches it to a new GitHub Release. Runs on windows-latest (not a
# cross-compile from ubuntu-latest) — bun build --compile's --windows-icon
# flag errors out ("only available when compiling on Windows") unless the
# build itself actually runs on a Windows host, found the hard way on the
# first real run of this workflow (2026-08-29): an earlier local "verified
# cross-compile" test was run from an already-Windows machine, which never
# actually exercised that restriction.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build Windows executable
        run: |
          bun run prebuild-embed
          bun build --compile \
            --windows-hide-console \
            --windows-icon=./assets/app-icon.ico \
            --windows-title="Warframe State Graph" \
            ./server/main.ts \
            --outfile ./dist/warframe-state-graph

      - name: Rename asset with version
        run: mv dist/warframe-state-graph.exe "dist/warframe-state-graph-${{ github.ref_name }}.exe"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ts/dist/warframe-state-graph-${{ github.ref_name }}.exe
          generate_release_notes: true
