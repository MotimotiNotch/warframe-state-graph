name: Release

# Tag push (e.g. `v1.0.0`) triggers a build of the distributable Windows exe
# and attaches it to a new GitHub Release. Runs on windows-latest (not a
# cross-compile from ubuntu-latest) — bun build --compile's --windows-icon
# flag errors out ("only available when compiling on Windows") unless the
# build itself actually runs on a Windows host, found the hard way on the
# first real run of this workflow (2026-08-29): an earlier local "verified
# cross-compile" test was run from an already-Windows machine, which never
# actually exercised that restriction.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The release body lists what changed since the previous tag, so
          # the whole history and every tag has to be present — the default
          # shallow clone has neither.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build Windows executable
        run: |
          bun run prebuild-embed
          bun build --compile \
            --windows-hide-console \
            --windows-icon=./assets/app-icon.ico \
            --windows-title="Warframe State Graph" \
            ./server/main.ts \
            --outfile ./dist/warframe-state-graph
          # Bun 1.4.0 leaves its own template icon group in the exe next to
          # ours, and Explorer picks the stale one (a 16px face stretched to
          # desktop size). Rewrite the icon resources via the Win32 API so
          # only the real 7-face group remains. See scripts/fix-windows-icon.ts.
          bun run scripts/fix-windows-icon.ts ./dist/warframe-state-graph.exe ./assets/app-icon.ico

      - name: Package into a dedicated folder
        # A bare .exe tends to end up loose in Downloads/Desktop, where the
        # data/ folder it creates on first save looks like a mystery item
        # dropped next to unrelated files (2026-08-29 のっち指摘). Zipping a
        # single top-level folder means Windows' "Extract All" gives the
        # user one self-contained folder to keep the exe and its data/ in
        # from the start. PowerShell's Compress-Archive over bash's `zip`
        # since the latter isn't guaranteed present on windows-latest.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/WarframeStateGraph | Out-Null
          Copy-Item dist/warframe-state-graph.exe package/WarframeStateGraph/warframe-state-graph.exe
          Copy-Item assets/release-readme.txt package/WarframeStateGraph/README.txt
          Compress-Archive -Path package/WarframeStateGraph -DestinationPath "dist/warframe-state-graph-${{ github.ref_name }}.zip"

      # The Release page, not the Code page, is what SNS links to: someone
      # arriving from a post wants the download, and only the minority who
      # want the details should have to travel on to the README. So the body
      # is a distribution page (what it is in one line, then Download, then
      # what changed), never a copy of the README.
      #
      # generate_release_notes alone produced just a "Full Changelog" link
      # here — GitHub builds that list from merged PRs, and this repo's own
      # releases are cut from direct pushes to main — so the change list is
      # built from the commit subjects instead. It stays appended below the
      # body, which is where the compare link comes from.
      - name: Compose release notes
        shell: bash
        working-directory: .
        run: |
          version="${{ github.ref_name }}"
          prev=$(git describe --tags --abbrev=0 "${version}^" 2>/dev/null || true)
          range="${version}"
          [ -n "$prev" ] && range="${prev}..${version}"

          # 「今回の変更点」は手書きが最優先: .github/release-notes/<tag>.md を
          # 置いておけばそれがそのまま載る。コミット件名は開発者向けの英文なので、
          # 利用者に見せる一覧としては本来そちらが正しい。
          if [ -f ".github/release-notes/${version}.md" ]; then
            cp ".github/release-notes/${version}.md" changes.txt
          else
            # 手書きが無い時のフォールバック。Conventional Commits の feat/fix/perf
            # だけを拾う（chore/docs/test/refactor は配布ページに出す価値が無い）。
            git log --no-merges --pretty=format:'%s' "$range" > subjects.txt
            sed -E -n 's/^feat(\(.+\))?!?: /- 追加: /p; s/^fix(\(.+\))?!?: /- 修正: /p; s/^perf(\(.+\))?!?: /- 改善: /p' subjects.txt > changes.txt
          fi
          [ -s changes.txt ] || echo "- 内部的な変更のみ（利用者から見える変更はありません）" > changes.txt

          awk -v ver="$version" '
            /^<!--/ { skip = 1 }
            skip { if (/-->/) skip = 0; next }
            /^%CHANGES%$/ { while ((getline line < "changes.txt") > 0) print line; next }
            { gsub(/%VERSION%/, ver); print }
          ' .github/release-body.md > release-body.md

          echo "--- composed release body ---"
          cat release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ts/dist/warframe-state-graph-${{ github.ref_name }}.zip
          body_path: release-body.md
          generate_release_notes: true
